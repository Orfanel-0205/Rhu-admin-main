# .github/workflows/ci.yml -- Ka-Agapay web admin (React + Vite + TypeScript)
#
# WHY THIS EXISTS
# ---------------
# This repo had no version control at all until 2026-09-02 and no CI until
# 2026-09-05. It also has zero automated tests, so this pipeline cannot check
# behaviour -- but it CAN check the two things that actually broke here before:
# that the code still typechecks, and that it still produces a real build.
#
# Deploy for this app is manual (build -> zip -> scp to the droplet, no CI/CD),
# which means a broken build is discovered on the server rather than before
# leaving the laptop. Running the same build here, on a clean checkout from the
# lockfile, catches "works on my machine" before it reaches production.
#
# The build step is not a formality: it is the only gate this repo has. A
# checkout that typechecks but fails to bundle is a deploy that produces a blank
# page.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` so the lockfile is authoritative. This checkout is clean --
      # unlike a laptop, which on 2026-09-03 had 43 uncommitted files sitting in
      # the tree at deploy time.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      # Assert the build produced a WORKING app, not merely some files.
      #
      # STRENGTHENED AFTER A PROVEN BLIND SPOT. This step used to check only
      # that dist/index.html existed and that at least one .js file was present.
      # Gutting src/main.tsx so the app never mounts still produced a build that
      # passed: index.html was there, a 0.71 kB JS file was there, and it even
      # reported a reassuring "build size: 5.0M" -- which is the copied public/
      # images, not the app. A completely blank page sailed through.
      #
      # That is the same failure shape as the APK boot test's false positive:
      # superficial signals instead of expected content. These checks assert
      # what has to be true for the app to actually run.
      - name: Verify build output
        run: |
          set -euo pipefail

          test -f dist/index.html || { echo "FAIL: dist/index.html missing after build"; exit 1; }

          # 1. index.html must actually reference a built JS bundle. Vite emits
          #    a hashed filename, so this also catches a stale or empty shell.
          bundle_ref=$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -1 | sed 's/src="//; s/"//')
          if [ -z "$bundle_ref" ]; then
            echo "FAIL: dist/index.html references no JS bundle -- the app cannot start."
            echo "--- index.html ---"; cat dist/index.html
            exit 1
          fi

          # 2. Everything index.html points at must exist on disk. A dangling
          #    reference is a 404 at runtime and a blank page for the user.
          for ref in $(grep -oE '(src|href)="/[^"]+"' dist/index.html | sed 's/.*="//; s/"//'); do
            if [ ! -f "dist${ref}" ]; then
              echo "FAIL: index.html references ${ref}, which does not exist in dist/."
              exit 1
            fi
          done

          # 3. The bundle must be a plausible size. The real app is ~2 MB; an
          #    app that never mounts is under 1 kB. 500 kB sits far below the
          #    real figure and far above a broken one, so it will not flake on
          #    ordinary size drift.
          bundle_bytes=$(wc -c < "dist${bundle_ref}")
          if [ "$bundle_bytes" -lt 500000 ]; then
            echo "FAIL: JS bundle is only ${bundle_bytes} bytes (expected > 500000)."
            echo "The build succeeded but produced almost no application code --"
            echo "usually the entry point stopped mounting the app."
            exit 1
          fi

          # 4. The app's own routes must be in the bundle. This is the content
          #    check: it is what distinguishes 'a real app was built' from
          #    'something was built'.
          missing=""
          for route in /dashboard /appointments /queue /consultations /telemedicine; do
            grep -q "\"${route}\"" "dist${bundle_ref}" || missing="${missing} ${route}"
          done
          if [ -n "$missing" ]; then
            echo "FAIL: these routes are missing from the built bundle:${missing}"
            echo "Screens that vanish from the bundle are screens users cannot reach."
            exit 1
          fi

          echo "ok: index.html -> ${bundle_ref}"
          echo "ok: all referenced assets exist"
          echo "ok: bundle is ${bundle_bytes} bytes"
          echo "ok: expected routes present in the bundle"
          du -sh dist | sed 's/^/build size (incl. public assets): /'

      # Makes the deployable artifact downloadable from the run, so a deploy can
      # use exactly what CI verified instead of a locally rebuilt copy.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-dist-${{ github.run_id }}
          path: dist/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory, and deliberately NOT allowed to go red. The remaining
    # advisories need a react-router major bump, so this could never pass until
    # that lands -- and a permanently-red check teaches people to ignore the red
    # X, which is how a real failure gets missed. Findings go to the run summary
    # instead, where they are read rather than dismissed.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: npm audit
        run: |
          echo "## Web admin dependency advisories" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Advisory only -- see the workflow comments for why this does not fail the build." >> "$GITHUB_STEP_SUMMARY"
